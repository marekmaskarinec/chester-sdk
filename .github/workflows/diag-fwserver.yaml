name: Diag FW server

# TEMPORARY diagnostic — find the upload failure boundary (size vs time).
# Sweeps the zephyr.elf size and records result + elapsed seconds.

on:
  workflow_dispatch:
  push:
    branches:
      - 'marek.maskarinec/app-tag-version'
    paths:
      - '.github/workflows/diag-fwserver.yaml'

jobs:
  size-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fw-clime
          path: fwclime
          run-id: 27825136695
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install hardwario
      - name: sweep elf size, record result + timing
        continue-on-error: true
        working-directory: fwclime
        env:
          HARDWARIO_CLOUD_TOKEN: ${{ secrets.HARDWARIO_CLOUD_TOKEN }}
        run: |
          set +e
          echo "hex size: $(stat -c%s build/zephyr/merged.hex 2>/dev/null) bytes"
          for MB in 2 4 6 8 10 12 16 20; do
            head -c $((MB*1024*1024)) /dev/urandom > build/zephyr/zephyr.elf
            START=$SECONDS
            OUT=$(hardwario chester app fw upload --name hio-chester-clime-diagtest --version v0.0.1-diag 2>&1)
            RC=$?
            EL=$((SECONDS-START))
            if [ $RC -eq 0 ]; then
              echo "elf=${MB}MB  OK    in ${EL}s  ($(echo "$OUT" | grep -o '[0-9a-f]\{32\}' | head -1))"
            else
              echo "elf=${MB}MB  FAIL  in ${EL}s  -> $(echo "$OUT" | tr '\n' ' ' | tail -c 160)"
            fi
          done
          echo "===== curl raw timing to endpoint (TLS only, expect 401/4xx fast) ====="
          curl -sS -m 30 -o /dev/null -w "connect=%{time_connect}s appconnect=%{time_appconnect}s total=%{time_total}s http=%{http_code}\n" \
            https://firmware.hardwario.com/chester/api/v1/firmware
